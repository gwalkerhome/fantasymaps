<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>v1.3 | mybook</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Spectral:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .book-detail {
            display: grid;
            grid-template-columns: 220px 1fr;
            gap: 30px;
            align-items: start;
            margin-top: 20px;
        }
        .cover-col {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 8px;
        }
        .cover-frame {
            width: 100%;
            aspect-ratio: 2 / 3;
            background: var(--earth-brown);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--aged-parchment);
            box-shadow: 5px 5px 15px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }
        .cover-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .meta-list {
            list-style: none;
            padding: 0;
            margin: 0 0 20px 0;
        }
        .meta-list li {
            padding: 8px 0;
            border-bottom: 1px solid rgba(106, 79, 75, 0.25);
        }
        .meta-list .label {
            display: inline-block;
            min-width: 80px;
            font-weight: 700;
            color: var(--earth-brown);
            text-transform: uppercase;
            font-size: 0.8em;
            letter-spacing: 1px;
            margin-right: 10px;
        }
        .action-row {
            margin-top: 25px;
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
        }
        .action-cell {
            display: flex;
            flex-direction: column;
        }
        .coming-soon {
            font-size: 0.7em;
            font-style: italic;
            color: var(--earth-brown);
            margin-top: 6px;
            text-align: center;
        }

        /* ── Cover picker modal ─────────────────────────────────────────────── */
        #cover-modal-overlay {
            display: none;
            position: fixed; inset: 0; z-index: 1000;
            background: rgba(0,0,0,0.55);
            align-items: center; justify-content: center;
        }
        #cover-modal-overlay.open { display: flex; }
        #cover-modal-box {
            background: var(--aged-parchment);
            border: 2px solid var(--earth-brown);
            border-radius: 6px;
            padding: 22px 24px;
            width: 92%; max-width: 560px;
            max-height: 85vh; overflow-y: auto;
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
        }
        .cm-title {
            font-family: 'Cinzel', serif;
            font-size: 0.82em; font-weight: 700;
            color: var(--earth-brown);
            text-transform: uppercase; letter-spacing: 0.08em;
            margin: 0 0 14px;
        }
        .cm-section-label {
            font-size: 0.78em; font-weight: 700;
            color: var(--earth-brown);
            text-transform: uppercase; letter-spacing: 0.06em;
            margin: 14px 0 8px;
        }
        .cm-thumb-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
            gap: 8px;
            margin-bottom: 4px;
        }
        .cm-thumb {
            aspect-ratio: 2/3;
            object-fit: cover;
            border: 2px solid transparent;
            border-radius: 3px;
            cursor: pointer;
            transition: border-color 0.15s, opacity 0.15s;
            width: 100%;
            display: block;
        }
        .cm-thumb:hover   { border-color: var(--earth-brown); }
        .cm-thumb.selected { border-color: var(--moss-green); outline: 2px solid var(--moss-green); }
        .cm-upload-row {
            display: flex; align-items: center; gap: 10px;
            margin-top: 8px; flex-wrap: wrap;
        }
        .cm-upload-name {
            font-size: 0.8em; font-style: italic;
            color: var(--earth-brown); flex: 1;
        }
        .cm-status {
            font-size: 0.8em; font-style: italic;
            color: var(--earth-brown); margin-top: 10px;
            min-height: 1.2em;
        }
        .cm-buttons {
            display: flex; gap: 8px; justify-content: flex-end;
            margin-top: 16px;
            border-top: 1px solid rgba(106,79,75,0.2);
            padding-top: 14px;
        }

        /* ── Series editor ──────────────────────────────────────────────────── */
        .series-editor {
            border: 1px solid rgba(106, 79, 75, 0.25);
            border-radius: 4px;
            padding: 12px 14px;
            margin-bottom: 20px;
        }
        .series-editor-title {
            font-family: 'Cinzel', serif;
            font-size: 0.72em; font-weight: 700;
            color: var(--earth-brown);
            text-transform: uppercase; letter-spacing: 0.08em;
            margin-bottom: 10px;
        }
        .series-row {
            display: flex; align-items: center; gap: 8px;
            margin-bottom: 8px;
        }
        .series-row .label { min-width: 60px; margin-right: 0; }
        .series-input {
            font-family: inherit; font-size: 0.85em;
            padding: 4px 8px;
            border: 1px solid var(--earth-brown); border-radius: 3px;
            background: var(--aged-parchment); color: var(--iron-ink);
        }
        .series-status {
            font-size: 0.8em; font-style: italic;
            color: var(--earth-brown); margin-left: 4px;
        }

        @media (max-width: 600px) {
            .book-detail { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="back-nav" style="margin-bottom: 20px;">
            <a href="index.html" class="btn secondary">← library</a>
        </div>

        <h1 id="book-title">loading tome...</h1>

        <div id="book-content">
            <p style="text-align: center;">consulting the vault...</p>
        </div>
    </div>

    <!-- ── Add / restore map modal ──────────────────────────────────────────── -->
    <div id="am-modal-overlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.55); z-index:1000; display:none; align-items:center; justify-content:center;">
        <div id="am-modal-box" style="background:var(--aged-parchment); border:2px solid var(--earth-brown); border-radius:6px; padding:24px; width:360px; max-width:90vw; font-size:0.9em;">
            <div style="font-family:'Cinzel',serif; font-size:1em; font-weight:700; margin-bottom:14px;">Add / Restore Map</div>
            <label style="display:block; margin-bottom:4px; font-size:0.85em;">Map title (e.g. "HD Roshar"):</label>
            <input type="text" id="am-name" style="width:100%; box-sizing:border-box; padding:5px 8px; margin-bottom:12px; font-family:inherit; font-size:0.88em; border:1px solid var(--earth-brown); border-radius:3px; background:var(--aged-parchment);" placeholder="Map name…">
            <label style="display:block; margin-bottom:4px; font-size:0.85em;">Map image file:</label>
            <div style="display:flex; align-items:center; gap:8px; margin-bottom:14px;">
                <button class="btn secondary" id="am-choose-btn" style="font-size:0.82em;">Choose image…</button>
                <span id="am-filename" style="font-size:0.82em; font-style:italic; color:var(--earth-brown);">No file chosen</span>
            </div>
            <input type="file" id="am-file-input" accept="image/*" style="display:none">
            <div id="am-status" style="font-size:0.82em; font-style:italic; color:var(--earth-brown); min-height:18px; margin-bottom:12px;"></div>
            <div style="display:flex; gap:8px; justify-content:flex-end;">
                <button class="btn" id="am-save-btn" disabled>Upload &amp; add</button>
                <button class="btn secondary" id="am-cancel-btn">Cancel</button>
            </div>
        </div>
    </div>

    <!-- ── Cover picker modal ──────────────────────────────────────────────── -->
    <div id="cover-modal-overlay">
        <div id="cover-modal-box">
            <div class="cm-title">Change Cover Image</div>

            <div class="cm-section-label">Pick from stored images</div>
            <div class="cm-thumb-grid" id="cm-thumb-grid">
                <em style="font-size:0.82em; color:#888;">loading…</em>
            </div>

            <div class="cm-section-label">Or upload your own</div>
            <div class="cm-upload-row">
                <button class="btn secondary" id="cm-choose-btn">Choose image…</button>
                <span class="cm-upload-name" id="cm-upload-name">No file chosen</span>
            </div>
            <input type="file" id="cm-file-input" accept="image/*" style="display:none">

            <div class="cm-status" id="cm-status"></div>

            <div class="cm-buttons">
                <button class="btn" id="cm-save-btn" disabled>Save Cover</button>
                <button class="btn secondary" id="cm-cancel-btn">Cancel</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { db, uploadartifact } from './firebase.js';
        import {
            doc, getDoc, updateDoc, collection, getDocs
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        function getParam(name) {
            return new URLSearchParams(window.location.search).get(name);
        }

        const userid = getParam('u');
        const author = getParam('a');
        const series = getParam('s');
        const bookid = getParam('b');

        let bookData      = null;
        let selectedUrl   = null;   // url chosen from thumbnails
        let uploadFile    = null;   // file chosen for upload

        // ── Load and render the book page ─────────────────────────────────────
        async function loadBook() {
            const titleEl   = document.getElementById('book-title');
            const contentEl = document.getElementById('book-content');

            if (!userid || !author || !series || !bookid) {
                titleEl.textContent = "missing book reference";
                contentEl.innerHTML = '<p style="text-align:center;">this page needs u, a, s and b parameters in the url. <a href="index.html">return to the library</a>.</p>';
                return;
            }

            try {
                const bookRef = doc(db, "users", userid, "authors", author, "series", series, "books", bookid);
                const snap    = await getDoc(bookRef);

                if (!snap.exists()) {
                    titleEl.textContent = "tome not found";
                    contentEl.innerHTML = '<p style="text-align:center;">no record matches that book reference. <a href="index.html">return to the library</a>.</p>';
                    return;
                }

                bookData = snap.data();
                titleEl.textContent = bookData.title || bookid;

                renderBookContent(bookData);

            } catch (err) {
                console.error(err);
                document.getElementById('book-title').textContent = "error loading tome";
                document.getElementById('book-content').innerHTML = `<p style="text-align:center;">${err.message}</p>`;
            }
        }

        function renderBookContent(book) {
            const mapsCount     = Array.isArray(book.maps) ? book.maps.length : 0;
            const params        = `?u=${userid}&a=${author}&s=${series}&b=${bookid}`;
            const seriesDisplay = book.series_label || book.series || '—';
            const volDisplay    = book.volume_number ? `&nbsp;<span style="font-style:italic;opacity:0.65;">vol. ${book.volume_number}</span>` : '';

            document.getElementById('book-content').innerHTML = `
                <div class="book-detail">
                    <div class="cover-col">
                        <div class="cover-frame" id="cover-frame">
                            ${book.cover
                                ? `<img id="cover-img" src="${book.cover}" alt="${book.title}">`
                                : `<span id="cover-img">no cover</span>`
                            }
                        </div>
                        <button class="btn secondary" id="change-cover-btn" style="font-size:0.78em; padding:5px 8px;">
                            change cover
                        </button>
                    </div>
                    <div>
                        <ul class="meta-list">
                            <li><span class="label">author</span>${book.author || '—'}</li>
                            <li><span class="label">series</span><span id="series-display">${seriesDisplay}</span>${volDisplay}</li>
                            <li><span class="label">maps</span>${mapsCount}</li>
                        </ul>

                        <!-- ── Series editor ───────────────────────────────── -->
                        <div class="series-editor">
                            <div class="series-editor-title">series &amp; volume</div>
                            <div class="series-row">
                                <span class="label">series</span>
                                <select id="series-select" class="btn secondary series-input" style="min-width:160px;">
                                    <option value="">loading…</option>
                                </select>
                            </div>
                            <div class="series-row" id="series-other-row" style="display:none;">
                                <span class="label"></span>
                                <input type="text" id="series-other-input" class="series-input"
                                       placeholder="enter series name…" style="min-width:160px;">
                            </div>
                            <div class="series-row">
                                <span class="label">volume</span>
                                <input type="number" id="volume-input" class="series-input"
                                       min="1" placeholder="—" style="width:60px;"
                                       value="${book.volume_number || ''}">
                            </div>
                            <div class="series-row" style="margin-top:4px;">
                                <span class="label"></span>
                                <button id="series-save-btn" class="btn" style="font-size:0.82em; padding:5px 12px;">save</button>
                                <span id="series-status" class="series-status"></span>
                            </div>
                        </div>

                        <div class="action-row">
                            <div class="action-cell">
                                <a href="companion.html${params}" class="btn">accompany me</a>
                                <div class="coming-soon">companion view — coming soon</div>
                            </div>
                            <div class="action-cell">
                                <a href="mapgen.html${params}" class="btn secondary">edit map overlay</a>
                            </div>
                            <div class="action-cell">
                                <button class="btn secondary" id="add-map-btn">add / restore map</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('change-cover-btn').onclick = openCoverModal;
            document.getElementById('add-map-btn').onclick = openAddMapModal;
            wireSeriesEditor(book);
            populateSeriesDropdown(book);
        }

        // ── Series editor ─────────────────────────────────────────────────────
        async function loadExistingSeries() {
            try {
                const labelsSet = new Set();
                const authorsSnap = await getDocs(collection(db, 'users', userid, 'authors'));
                for (const aDoc of authorsSnap.docs) {
                    const serSnap = await getDocs(
                        collection(db, 'users', userid, 'authors', aDoc.id, 'series')
                    );
                    for (const sDoc of serSnap.docs) {
                        const bSnap = await getDocs(
                            collection(db, 'users', userid, 'authors', aDoc.id, 'series', sDoc.id, 'books')
                        );
                        bSnap.docs.forEach(bDoc => {
                            const lbl = bDoc.data().series_label;
                            if (lbl && lbl !== 'Standalone') labelsSet.add(lbl);
                        });
                    }
                }
                return Array.from(labelsSet).sort();
            } catch (e) {
                console.warn('Could not load existing series:', e);
                return [];
            }
        }

        async function populateSeriesDropdown(book) {
            const currentLabel = book.series_label || '';
            const select       = document.getElementById('series-select');
            const existingLabels = await loadExistingSeries();

            // Build options: Standalone, then any existing named series, then Other…
            const namedOptions = existingLabels.filter(l => l !== 'Standalone');
            const allOptions   = ['Standalone', ...namedOptions, 'Other…'];

            select.innerHTML = allOptions.map(opt =>
                `<option value="${opt === 'Other…' ? '__other__' : opt}">${opt}</option>`
            ).join('');

            // Select the current value
            if (!currentLabel || currentLabel === 'Standalone') {
                select.value = 'Standalone';
            } else if (namedOptions.includes(currentLabel)) {
                select.value = currentLabel;
            } else {
                // Current label not in list — show Other with pre-filled text
                select.value = '__other__';
                document.getElementById('series-other-row').style.display = 'flex';
                document.getElementById('series-other-input').value = currentLabel;
            }
        }

        function wireSeriesEditor(book) {
            const select    = document.getElementById('series-select');
            const otherRow  = document.getElementById('series-other-row');
            const otherInput= document.getElementById('series-other-input');
            const saveBtn   = document.getElementById('series-save-btn');
            const statusEl  = document.getElementById('series-status');

            select.onchange = () => {
                otherRow.style.display = select.value === '__other__' ? 'flex' : 'none';
            };

            saveBtn.onclick = async () => {
                saveBtn.disabled = true;
                statusEl.textContent = 'Saving…';
                try {
                    let newLabel = select.value === '__other__'
                        ? (otherInput.value.trim() || 'Standalone')
                        : select.value;
                    const volRaw = document.getElementById('volume-input').value;
                    const volNum = volRaw ? parseInt(volRaw) : null;

                    const bookRef = doc(db, 'users', userid, 'authors', author, 'series', series, 'books', bookid);
                    await updateDoc(bookRef, {
                        series_label:  newLabel,
                        volume_number: volNum
                    });

                    bookData.series_label  = newLabel;
                    bookData.volume_number = volNum;

                    // Update the visible series display
                    const dispEl = document.getElementById('series-display');
                    if (dispEl) dispEl.textContent = newLabel;

                    statusEl.textContent = 'saved ✓';
                    setTimeout(() => { statusEl.textContent = ''; }, 2500);
                } catch (err) {
                    console.error(err);
                    statusEl.textContent = 'error: ' + err.message;
                } finally {
                    saveBtn.disabled = false;
                }
            };
        }

        // ── Cover modal ────────────────────────────────────────────────────────
        function openCoverModal() {
            selectedUrl = null;
            uploadFile  = null;
            document.getElementById('cm-upload-name').textContent = 'No file chosen';
            document.getElementById('cm-status').textContent = '';
            document.getElementById('cm-save-btn').disabled = true;

            // Build thumbnail grid from previously saved cover image(s)
            const grid   = document.getElementById('cm-thumb-grid');
            const images = [];

            if (bookData && bookData.cover) {
                images.push({ url: bookData.cover, label: 'current cover' });
            }

            if (images.length === 0) {
                grid.innerHTML = '<em style="font-size:0.82em; color:#888;">No saved cover found — upload one below.</em>';
            } else {
                grid.innerHTML = images.map((img, i) => `
                    <img class="cm-thumb" src="${img.url}" alt="${img.label}"
                         title="${img.label}" data-url="${img.url}" data-idx="${i}">
                `).join('');

                grid.querySelectorAll('.cm-thumb').forEach(thumb => {
                    thumb.onclick = () => {
                        grid.querySelectorAll('.cm-thumb').forEach(t => t.classList.remove('selected'));
                        thumb.classList.add('selected');
                        selectedUrl = thumb.dataset.url;
                        uploadFile  = null;
                        document.getElementById('cm-upload-name').textContent = 'No file chosen';
                        document.getElementById('cm-save-btn').disabled = false;
                        document.getElementById('cm-status').textContent = '';
                    };
                });
            }

            document.getElementById('cover-modal-overlay').classList.add('open');
        }

        function closeCoverModal() {
            document.getElementById('cover-modal-overlay').classList.remove('open');
        }

        // File upload wiring
        document.getElementById('cm-choose-btn').onclick = () => {
            document.getElementById('cm-file-input').click();
        };

        document.getElementById('cm-file-input').onchange = function() {
            const file = this.files[0];
            if (!file) return;
            uploadFile  = file;
            selectedUrl = null;
            document.getElementById('cm-thumb-grid').querySelectorAll('.cm-thumb')
                .forEach(t => t.classList.remove('selected'));
            document.getElementById('cm-upload-name').textContent = file.name;
            document.getElementById('cm-save-btn').disabled = false;
            document.getElementById('cm-status').textContent = '';
        };

        document.getElementById('cm-cancel-btn').onclick = closeCoverModal;

        // Save cover
        document.getElementById('cm-save-btn').onclick = async () => {
            const statusEl  = document.getElementById('cm-status');
            const saveBtn   = document.getElementById('cm-save-btn');
            saveBtn.disabled = true;

            try {
                let newCoverUrl = selectedUrl;

                if (uploadFile) {
                    statusEl.textContent = 'Uploading image…';
                    const storagePath = `users/${userid}/${author}/${series}/${bookid}/cover.jpg`;
                    newCoverUrl = await uploadartifact(storagePath, uploadFile);
                    if (!newCoverUrl) throw new Error('Upload returned no URL.');
                }

                if (!newCoverUrl) throw new Error('No image selected.');

                statusEl.textContent = 'Saving to vault…';
                const bookRef = doc(db, 'users', userid, 'authors', author, 'series', series, 'books', bookid);
                await updateDoc(bookRef, { cover: newCoverUrl });

                // Update local cache and refresh the cover display
                bookData.cover = newCoverUrl;
                const coverFrame = document.getElementById('cover-frame');
                coverFrame.innerHTML = `<img id="cover-img" src="${newCoverUrl}" alt="cover">`;

                statusEl.textContent = 'Cover updated ✓';
                setTimeout(closeCoverModal, 900);

            } catch (err) {
                console.error(err);
                statusEl.textContent = 'Error: ' + err.message;
                saveBtn.disabled = false;
            }
        };

        // ── Add / restore map modal ───────────────────────────────────────────
        let amFile = null;

        function openAddMapModal() {
            amFile = null;
            document.getElementById('am-name').value     = '';
            document.getElementById('am-filename').textContent = 'No file chosen';
            document.getElementById('am-status').textContent   = '';
            document.getElementById('am-save-btn').disabled    = true;
            document.getElementById('am-modal-overlay').style.display = 'flex';
        }
        function closeAddMapModal() {
            document.getElementById('am-modal-overlay').style.display = 'none';
        }

        document.getElementById('am-choose-btn').onclick = () => {
            document.getElementById('am-file-input').click();
        };
        document.getElementById('am-file-input').onchange = function() {
            const file = this.files[0];
            if (!file) return;
            amFile = file;
            document.getElementById('am-filename').textContent = file.name;
            document.getElementById('am-save-btn').disabled =
                !document.getElementById('am-name').value.trim();
        };
        document.getElementById('am-name').oninput = function() {
            document.getElementById('am-save-btn').disabled = !this.value.trim() || !amFile;
        };
        document.getElementById('am-cancel-btn').onclick = closeAddMapModal;

        document.getElementById('am-save-btn').onclick = async () => {
            const statusEl = document.getElementById('am-status');
            const saveBtn  = document.getElementById('am-save-btn');
            const mapName  = document.getElementById('am-name').value.trim();
            if (!mapName || !amFile) return;
            saveBtn.disabled = true;
            try {
                statusEl.textContent = 'Uploading map image…';
                const filename    = amFile.name.replace(/\s+/g,'_').toLowerCase();
                const storagePath = `users/${userid}/${author}/${series}/${bookid}/maps/${filename}`;
                const url = await uploadartifact(storagePath, amFile);
                if (!url) throw new Error('Upload returned no URL.');

                statusEl.textContent = 'Saving to vault…';
                const bookRef  = doc(db, 'users', userid, 'authors', author, 'series', series, 'books', bookid);
                const bookSnap = await getDoc(bookRef);
                const currentMaps = (bookSnap.exists() ? bookSnap.data().maps : null) || [];
                currentMaps.push({
                    name:       mapName,
                    url:        url,
                    source:     'upload',
                    alternates: [],
                    preferred:  'original'
                });
                await updateDoc(bookRef, { maps: currentMaps });

                // Update local bookData so the maps count refreshes
                bookData.maps = currentMaps;
                statusEl.textContent = `Map "${mapName}" added ✓`;

                // Refresh the maps count on screen
                const metaMaps = document.querySelector('.meta-list li:nth-child(3)');
                if (metaMaps) metaMaps.innerHTML = `<span class="label">maps</span>${currentMaps.length}`;

                setTimeout(closeAddMapModal, 1200);
            } catch (err) {
                console.error(err);
                statusEl.textContent = 'Error: ' + err.message;
                saveBtn.disabled = false;
            }
        };

        window.onload = loadBook;
    </script>
</body>
</html>
