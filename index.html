<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>v1.1 | high fantasy companion - library</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Spectral:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>high fantasy companion</h1>
        
        <section class="upload-section" style="background: rgba(106, 153, 78, 0.1); padding: 25px; border: 2px dashed var(--moss-green); margin-bottom: 30px;">
            <h3>upload new tome</h3>
            <p>select an epub or pdf file for the ai to analyze characters and locations.</p>
            <div class="form-group">
                <input type="file" id="bookupload" accept=".epub,.pdf">
            </div>
            <button class="btn" onclick="alert('the engine is being calibrated...')">process book</button>
        </section>

        <section class="library-section">
            <h3>my collection</h3>
            <ul class="settings-list" id="librarylist">
                <li class="settings-item" style="display: flex; justify-content: space-between; align-items: center;">
                    <div>
                        <strong style="font-family: 'Cinzel', serif;">the way of kings</strong><br>
                        <span style="font-size: 0.8em; color: var(--earth-brown);">status: ready for adventure</span>
                    </div>
                    <a href="map.html" class="btn">open map</a>
                </li>
            </ul>
        </section>

        <div style="margin-top: 40px; text-align: center;">
            <a href="settings.html" class="btn secondary">settings & tools</a>
        </div>
    </div>

</body>
</html>
