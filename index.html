<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>v1.3 | high fantasy companion - library</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Spectral:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .book-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 30px;
            margin-top: 30px;
        }
        .book-card {
            background: rgba(255, 255, 255, 0.3);
            border: 1px solid var(--earth-brown);
            padding: 10px;
            text-align: center;
            transition: transform 0.3s ease;
        }
        .book-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.5);
        }
        .cover-preview {
            width: 100%;
            height: 280px;
            background: var(--earth-brown);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--aged-parchment);
            font-family: 'Cinzel', serif;
            object-fit: cover;
            box-shadow: 3px 3px 10px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>high fantasy companion</h1>
        
        <div style="text-align: center; margin-bottom: 40px; border-bottom: 1px solid var(--moss-green); padding-bottom: 20px;">
            <a href="scribe.html" class="btn">add new tome to vault</a>
        </div>

        <section class="library-section">
            <h3>my collection</h3>
            <div class="book-grid" id="librarylist">
                <p>consulting the shelves...</p>
            </div>
        </section>

        <div style="margin-top: 40px; text-align: center; border-top: 1px solid var(--moss-green); padding-top: 20px;">
            <a href="settings.html" class="btn secondary">settings & tools</a>
        </div>
    </div>

    <script type="module">
        import { fetchlibrary } from './firebase.js';

        async function refreshlibrary() {
            const grid = document.getElementById('librarylist');
            const books = await fetchlibrary();
            
            if (books.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center;">the shelves are currently bare.</p>';
                return;
            }

            grid.innerHTML = books.map(book => `
                <div class="book-card">
                    ${book.cover 
                        ? `<img src="${book.cover}" class="cover-preview" alt="${book.title}">`
                        : `<div class="cover-preview">No Cover Found</div>`
                    }
                    <strong style="display: block; margin-bottom: 10px; font-family: 'Cinzel', serif; font-size: 0.9em;">${book.title}</strong>
                    <a href="map.html?id=${book.id}" class="btn" style="font-size: 0.7em; padding: 8px 15px;">open map</a>
                </div>
            `).join('');
        }

        window.onload = refreshlibrary;
    </script>
</body>
</html>
