<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>v1.1 | arcane settings</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="back-nav"><a href="index.html" class="btn secondary">← library</a></div>
        <h1>arcane settings</h1>
        
        <section class="settings-card">
            <h3>gemini api gateway</h3>
            <div class="form-group">
                <label>api key</label>
                <input type="password" id="apikey" placeholder="enter your gemini key...">
            </div>
            <button class="btn" id="savekey">bind key to browser</button>
            <button class="btn secondary" id="testkey">scan for available models</button>
        </section>

        <section class="settings-card">
            <h3>available models</h3>
            <ul id="modellist" class="settings-list">
                <li class="settings-item">no models detected.</li>
            </ul>
        </section>
    </div>

    <script>
        const keyinput = document.getElementById('apikey');
        const list = document.getElementById('modellist');

        // load existing key
        keyinput.value = localStorage.getItem('gemini_api_key') || '';

        document.getElementById('savekey').onclick = () => {
            localStorage.setItem('gemini_api_key', keyinput.value);
            alert("key bound to local storage.");
        };

        document.getElementById('testkey').onclick = async () => {
            const key = keyinput.value;
            if (!key) return alert("enter a key first.");
            
            list.innerHTML = '<li class="settings-item">scanning...</li>';
            
            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${key}`);
                const data = await res.json();
                
                if (data.models) {
                    // ALL models shown, no filters.
                    list.innerHTML = data.models.map(m => `
                        <li class="settings-item">
                            <strong>${m.displayName}</strong><br>
                            <span style="font-size:0.7em;">${m.name}</span>
                        </li>
                    `).join('');
                } else {
                    list.innerHTML = '<li class="settings-item">no models found. check your key permissions.</li>';
                }
            } catch (e) {
                list.innerHTML = `<li class="settings-item">error: ${e.message}</li>`;
            }
        };
    </script>
</body>
</html>
