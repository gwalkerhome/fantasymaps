<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>v1.6 | api settings</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #fff; color: #000; }
        .split { display: flex; gap: 20px; }
        .panel { flex: 1; border: 1px solid #000; padding: 15px; }
        input { width: 100%; padding: 8px; margin: 10px 0; border: 1px solid #000; }
        button { padding: 10px; cursor: pointer; background: #000; color: #fff; border: none; }
        .model-list { margin-top: 20px; height: 300px; overflow-y: auto; background: #f0f0f0; padding: 10px; font-family: monospace; }
        .model-item { border-bottom: 1px solid #ccc; padding: 4px 0; }
    </style>
</head>
<body>

    <h2>API Configuration</h2>
    <div class="split">
        <div class="panel">
            <h3>Gemini Key</h3>
            <input type="password" id="g_input">
            <button onclick="saveG()">Save & List Gemini</button>
            <div id="g_status">Idle</div>
            <div id="g_list" class="model-list"></div>
        </div>

        <div class="panel">
            <h3>OpenAI Key</h3>
            <input type="password" id="o_input">
            <button onclick="saveO()">Save & List OpenAI</button>
            <div id="o_status">Idle</div>
            <div id="o_list" class="model-list"></div>
        </div>
    </div>

    <script>
        window.onload = function() {
            const g = localStorage.getItem('gemini_key');
            const o = localStorage.getItem('openai_key');
            if(g) { document.getElementById('g_input').value = g; fetchG(g); }
            if(o) { document.getElementById('o_input').value = o; fetchO(o); }
        };

        function saveG() {
            const val = document.getElementById('g_input').value;
            localStorage.setItem('gemini_key', val);
            fetchG(val);
        }

        function saveO() {
            const val = document.getElementById('o_input').value;
            localStorage.setItem('openai_key', val);
            fetchO(val);
        }

        async function fetchG(key) {
            const out = document.getElementById('g_list');
            const stat = document.getElementById('g_status');
            stat.innerText = "Fetching...";
            try {
                // UNFILTERED FETCH - identical to your working site
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${key}`);
                const data = await res.json();
                if(data.models) {
                    out.innerHTML = data.models.map(m => `<div class="model-item">${m.name}</div>`).join('');
                    stat.innerText = "Success";
                } else { stat.innerText = "Error: " + JSON.stringify(data); }
            } catch(e) { stat.innerText = "Network Error"; }
        }

        async function fetchO(key) {
            const out = document.getElementById('o_list');
            const stat = document.getElementById('o_status');
            stat.innerText = "Fetching...";
            try {
                const res = await fetch('https://api.openai.com/v1/models', {
                    headers: { 'Authorization': `Bearer ${key}` }
                });
                const data = await res.json();
                if(data.data) {
                    out.innerHTML = data.data.map(m => `<div class="model-item">${m.id}</div>`).join('');
                    stat.innerText = "Success";
                } else { stat.innerText = "Error: " + JSON.stringify(data); }
            } catch(e) { stat.innerText = "Network Error"; }
        }
    </script>
</body>
</html>
