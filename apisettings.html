<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>v1.0 | high fantasy companion - engine test</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --sidebar-bg: #020617;
            --card-bg: #1e293b;
            --accent-gemini: #38bdf8;
            --accent-openai: #10a37f;
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --border: #334155;
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        #sidebar {
            width: 260px;
            background: var(--sidebar-bg);
            padding: 24px;
            border-right: 1px solid var(--border);
            flex-shrink: 0;
        }

        .btn-stage-1 {
            background: var(--card-bg);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 12px 16px;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            text-align: left;
            margin-bottom: 10px;
            transition: all 0.2s;
            text-decoration: none;
            display: block;
        }

        .btn-stage-1:hover { opacity: 0.8; transform: translateX(4px); }

        #test-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        #top-bar {
            padding: 20px 40px;
            background: var(--sidebar-bg);
            border-bottom: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        #test-input {
            width: 100%;
            padding: 12px;
            background: var(--bg-color);
            border: 1px solid var(--border);
            color: white;
            border-radius: 8px;
            min-height: 80px;
            font-family: inherit;
        }

        #split-view {
            display: flex;
            flex-grow: 1;
            overflow: hidden;
        }

        .test-panel {
            flex: 1;
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
        }

        .gemini-side { border-right: 1px solid var(--border); }
        
        .panel-header {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--border);
        }

        .panel-header.gemini { border-color: var(--accent-gemini); color: var(--accent-gemini); }
        .panel-header.openai { border-color: var(--accent-openai); color: var(--accent-openai); }

        .model-select {
            background: var(--bg-color);
            border: 1px solid var(--border);
            color: white;
            padding: 5px;
            border-radius: 4px;
            font-size: 0.8rem;
        }

        .output-box {
            background: #020617;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border);
            min-height: 200px;
            white-space: pre-wrap;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            line-height: 1.5;
            color: #cbd5e1;
        }

        .status { font-size: 0.8rem; color: var(--text-dim); }
    </style>
</head>
<body>

    <nav id="sidebar">
        <h2 style="color: var(--accent-gemini);">companion</h2>
        <a href="index.html" class="btn-stage-1">Library Dashboard</a>
        <a href="apisettings.html" class="btn-stage-1">API Settings</a>
        <a href="settings.html" class="btn-stage-1">General Settings</a>
    </nav>

    <div id="test-container">
        <div id="top-bar">
            <textarea id="test-input" placeholder="Paste a paragraph or scene from your ebook here to test extraction..."></textarea>
            <div style="display: flex; justify-content: flex-end;">
                <button class="btn-stage-1" style="width: auto; background: var(--accent-gemini); color: black;" onclick="runExtractionTest()">Test Entity Extraction</button>
            </div>
        </div>

        <div id="split-view">
            <div class="test-panel gemini-side">
                <div class="panel-header gemini">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <h3>Gemini Analysis</h3>
                        <span id="gemini-status" class="status">Idle</span>
                    </div>
                    <select id="gemini-model-choice" class="model-select">
                        <option value="gemini-3-flash-preview">gemini-3-flash-preview</option>
                        <option value="gemini-3.1-pro-preview">gemini-3.1-pro-preview</option>
                    </select>
                </div>
                <div id="gemini-output" class="output-box">Waiting for text...</div>
            </div>

            <div class="test-panel">
                <div class="panel-header openai">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <h3>OpenAI Analysis</h3>
                        <span id="openai-status" class="status">Idle</span>
                    </div>
                    <select id="openai-model-choice" class="model-select">
                        <option value="gpt-4o">gpt-4o</option>
                        <option value="o1-preview">o1-preview</option>
                    </select>
                </div>
                <div id="openai-output" class="output-box">Waiting for text...</div>
            </div>
        </div>
    </div>

    <script>
        async function runExtractionTest() {
            const input = document.getElementById('test-input').value;
            if (!input) return alert("Please paste some book text to analyze.");

            const prompt = `Analyze this fantasy book excerpt: "${input}". 
            Return ONLY a valid JSON object:
            {
              "current_location": "name of the specific place",
              "characters_present": ["name1", "name2"],
              "summary": "15 word summary of the action",
              "visual_desc": "brief description for an image generator"
            }`;

            document.getElementById('gemini-output').innerText = "Reading excerpt...";
            document.getElementById('openai-output').innerText = "Reading excerpt...";

            callGemini(prompt);
            callOpenAI(prompt);
        }

        async function callGemini(prompt) {
            const key = localStorage.getItem('gemini_key');
            const model = document.getElementById('gemini-model-choice').value;
            const status = document.getElementById('gemini-status');
            const output = document.getElementById('gemini-output');

            if (!key) { output.innerText = "Error: Set Gemini Key in API Settings."; return; }
            status.innerText = "Analyzing...";

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${key}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                const data = await response.json();
                if (data.candidates && data.candidates[0]?.content?.parts?.[0]?.text) {
                    output.innerText = data.candidates[0].content.parts[0].text;
                    status.innerText = "Complete";
                } else {
                    output.innerText = "API Error: Check Key/Model";
                    status.innerText = "Failed";
                }
            } catch (err) {
                output.innerText = "Network Error: " + err.message;
                status.innerText = "Failed";
            }
        }

        async function callOpenAI(prompt) {
            const key = localStorage.getItem('openai_key');
            const model = document.getElementById('openai-model-choice').value;
            const status = document.getElementById('openai-status');
            const output = document.getElementById('openai-output');

            if (!key) { output.innerText = "Error: Set OpenAI Key in API Settings."; return; }
            status.innerText = "Analyzing...";

            try {
                const response = await fetch('https://api.openai.com/v1/chat/completions', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${key}`
                    },
                    body: JSON.stringify({
                        model: model,
                        messages: [{ role: "user", content: prompt }]
                    })
                });
                const data = await response.json();
                if (data.choices && data.choices[0]) {
                    output.innerText = data.choices[0].message.content;
                    status.innerText = "Complete";
                } else {
                    output.innerText = "API Error: Check Key/Model";
                    status.innerText = "Failed";
                }
            } catch (err) {
                output.innerText = "Network Error: " + err.message;
                status.innerText = "Failed";
            }
        }
    </script>
</body>
</html>
