<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>v1.8 | the arcane engine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Spectral:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0;
        }

        .container {
            max-width: 1000px;
            width: 90%;
            height: 85vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .back-nav {
            position: absolute;
            top: -10px;
            left: 0;
        }

        .split-engines {
            display: flex;
            gap: 20px;
            flex-grow: 1;
            overflow: hidden;
            margin-top: 40px;
        }

        .engine-card {
            flex: 1;
            background: rgba(255, 255, 255, 0.4);
            border: 1px solid var(--earth-brown);
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .model-scroll {
            flex-grow: 1;
            overflow-y: auto;
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid var(--moss-green);
            padding: 10px;
            margin-top: 15px;
            font-family: 'Spectral', serif;
        }

        .model-entry {
            padding: 6px 0;
            border-bottom: 1px solid rgba(106, 153, 78, 0.2);
            font-size: 0.9em;
            color: var(--iron-ink);
        }

        .status-indicator {
            font-size: 0.7em;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        input { width: 100%; padding: 8px; margin: 10px 0; border: 1px solid var(--earth-brown); box-sizing: border-box; }
    </style>
</head>
<body>

    <div class="container">
        <div class="back-nav">
            <a href="index.html" class="btn secondary" style="padding: 8px 15px;">← Library</a>
        </div>

        <h1 style="text-align: center;">the arcane engine</h1>
        
        <div class="split-engines">
            <div class="engine-card">
                <h3 style="color: var(--deep-forest); margin-top: 0;">Gemini</h3>
                <div id="g_status" class="status-indicator">Idle</div>
                <input type="password" id="g_input" placeholder="Enter Gemini Key...">
                <button class="btn" onclick="saveG()">Bind Key</button>
                <div class="model-scroll" id="g_list"></div>
            </div>

            <div class="engine-card">
                <h3 style="color: var(--earth-brown); margin-top: 0;">OpenAI</h3>
                <div id="o_status" class="status-indicator">Idle</div>
                <input type="password" id="o_input" placeholder="Enter OpenAI Key...">
                <button class="btn" onclick="saveO()">Bind Key</button>
                <div class="model-scroll" id="o_list"></div>
            </div>
        </div>
    </div>

    <script>
        window.onload = function() {
            const g = localStorage.getItem('gemini_key');
            const o = localStorage.getItem('openai_key');
            if(g) { document.getElementById('g_input').value = g; fetchG(g); }
            if(o) { document.getElementById('o_input').value = o; fetchO(o); }
        };

        function saveG() {
            const val = document.getElementById('g_input').value;
            localStorage.setItem('gemini_key', val);
            fetchG(val);
        }

        function saveO() {
            const val = document.getElementById('o_input').value;
            localStorage.setItem('openai_key', val);
            fetchO(val);
        }

        async function fetchG(key) {
            const out = document.getElementById('g_list');
            const stat = document.getElementById('g_status');
            stat.innerText = "Consulting...";
            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${key}`);
                const data = await res.json();
                if(data.models) {
                    // Removed all filters - displaying every model returned
                    out.innerHTML = data.models.map(m => `<div class="model-entry">${m.name.split('/')[1]}</div>`).join('');
                    stat.innerText = "Active";
                    stat.style.color = "var(--deep-forest)";
                } else { 
                    stat.innerText = "Check Key"; 
                    stat.style.color = "var(--gold-leaf)"; 
                }
            } catch(e) { 
                stat.innerText = "No Connection"; 
            }
        }

        async function fetchO(key) {
            const out = document.getElementById('o_list');
            const stat = document.getElementById('o_status');
            stat.innerText = "Consulting...";
            try {
                const res = await fetch('https://api.openai.com/v1/models', {
                    headers: { 'Authorization': `Bearer ${key}` }
                });
                const data = await res.json();
                if(data.data) {
                    out.innerHTML = data.data.map(m => `<div class="model-entry">${m.id}</div>`).join('');
                    stat.innerText = "Active";
                    stat.style.color = "var(--deep-forest)";
                } else { 
                    stat.innerText = "Check Key"; 
                    stat.style.color = "var(--gold-leaf)"; 
                }
            } catch(e) { 
                stat.innerText = "No Connection"; 
            }
        }
    </script>
</body>
</html>
