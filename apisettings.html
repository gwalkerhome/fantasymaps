<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>v1.1 | companion - api configuration</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Spectral:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>the arcane engine</h1>
        <p style="text-align: center; font-style: italic;">Provide the keys to the oracles so they may read your tomes.</p>
        
        <div class="form-group">
            <label for="gemini_key_input">gemini api key</label>
            <input type="password" id="gemini_key_input" placeholder="Paste your Gemini key here...">
        </div>

        <div class="form-group">
            <label for="openai_key_input">openai api key</label>
            <input type="password" id="openai_key_input" placeholder="Paste your OpenAI key here...">
        </div>

        <div style="display: flex; gap: 15px; justify-content: center; margin-top: 30px;">
            <button class="btn" onclick="saveKeys()">Bind Keys</button>
            <a href="settings.html" class="btn secondary">Return</a>
        </div>

        <div class="info-box">
            <strong>Security Note:</strong> Your keys are etched only into this device's local memory (localStorage). They are never sent to any server other than the AI providers themselves.
        </div>
    </div>

    <script>
        // Load existing keys if they exist
        window.onload = function() {
            if(localStorage.getItem('gemini_key')) {
                document.getElementById('gemini_key_input').value = localStorage.getItem('gemini_key');
            }
            if(localStorage.getItem('openai_key')) {
                document.getElementById('openai_key_input').value = localStorage.getItem('openai_key');
            }
        }

        function saveKeys() {
            const gKey = document.getElementById('gemini_key_input').value;
            const oKey = document.getElementById('openai_key_input').value;
            
            localStorage.setItem('gemini_key', gKey);
            localStorage.setItem('openai_key', oKey);
            
            alert('The engine is now primed. Your keys have been saved.');
        }
    </script>

</body>
</html>
