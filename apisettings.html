<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>v1.5 | api settings</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f4f4; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 20px; border: 1px solid #ccc; }
        .split { display: flex; gap: 20px; }
        .panel { flex: 1; padding: 15px; border: 1px solid #ddd; border-radius: 8px; }
        input { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; }
        button { padding: 10px 20px; cursor: pointer; background: #007bff; color: white; border: none; }
        .model-list { margin-top: 20px; height: 300px; overflow-y: auto; background: #eee; padding: 10px; font-size: 0.9em; }
        .model-item { border-bottom: 1px solid #ccc; padding: 5px 0; }
    </style>
</head>
<body>

<div class="container">
    <h2>API Engine Configuration</h2>
    <div class="split">
        <div class="panel">
            <h3>Gemini API</h3>
            <input type="password" id="g_input" placeholder="Paste Gemini Key...">
            <button onclick="saveG()">Save & List Models</button>
            <div id="g_status">Idle</div>
            <div class="model-list" id="g_list"></div>
        </div>

        <div class="panel">
            <h3>OpenAI API</h3>
            <input type="password" id="o_input" placeholder="Paste OpenAI Key...">
            <button onclick="saveO()">Save & List Models</button>
            <div id="o_status">Idle</div>
            <div class="model-list" id="o_list"></div>
        </div>
    </div>
    <p><a href="index.html">Back to Dashboard</a></p>
</div>

<script>
    window.onload = function() {
        const g = localStorage.getItem('gemini_key');
        const o = localStorage.getItem('openai_key');
        if(g) { document.getElementById('g_input').value = g; fetchG(g); }
        if(o) { document.getElementById('o_input').value = o; fetchO(o); }
    };

    function saveG() {
        const val = document.getElementById('g_input').value;
        localStorage.setItem('gemini_key', val);
        fetchG(val);
    }

    function saveO() {
        const val = document.getElementById('o_input').value;
        localStorage.setItem('openai_key', val);
        fetchO(val);
    }

    async function fetchG(key) {
        const out = document.getElementById('g_list');
        const stat = document.getElementById('g_status');
        stat.innerText = "Connecting...";
        try {
            // Using the v1beta endpoint from your working sample
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${key}`);
            const data = await res.json();
            if(data.models) {
                out.innerHTML = data.models
                    .filter(m => m.supportedActions.includes('generateContent'))
                    .map(m => `<div class="model-item">${m.name.split('/')[1]}</div>`).join('');
                stat.innerText = "Success";
            } else { stat.innerText = "Error: " + JSON.stringify(data); }
        } catch(e) { stat.innerText = "Network Error"; }
    }

    async function fetchO(key) {
        const out = document.getElementById('o_list');
        const stat = document.getElementById('o_status');
        stat.innerText = "Connecting...";
        try {
            const res = await fetch('https://api.openai.com/v1/models', {
                headers: { 'Authorization': `Bearer ${key}` }
            });
            const data = await res.json();
            if(data.data) {
                out.innerHTML = data.data
                    .filter(m => m.id.includes('gpt') || m.id.includes('o1'))
                    .map(m => `<div class="model-item">${m.id}</div>`).join('');
                stat.innerText = "Success";
            } else { stat.innerText = "Error: " + JSON.stringify(data); }
        } catch(e) { stat.innerText = "Network Error"; }
    }
</script>

</body>
</html>
