<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>v1.3 | companion - api configuration</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Spectral:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            overflow: hidden;
            height: 100vh;
        }

        #split-view {
            display: flex;
            flex-grow: 1;
            height: 70vh; /* Controlled height for the panels */
            gap: 20px;
            margin-top: 20px;
        }

        .engine-panel {
            flex: 1;
            background: rgba(255, 255, 255, 0.3);
            border: 1px solid var(--earth-brown);
            padding: 20px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .panel-header {
            font-family: 'Cinzel', serif;
            border-bottom: 2px solid var(--moss-green);
            margin-bottom: 15px;
            padding-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .model-list {
            flex-grow: 1;
            overflow-y: auto;
            background: rgba(255, 255, 255, 0.5);
            padding: 10px;
            border: 1px solid var(--border-scroll);
            font-family: 'Spectral', serif;
        }

        .model-item {
            padding: 8px;
            border-bottom: 1px solid rgba(0,0,0,0.1);
            font-size: 0.9em;
            display: flex;
            justify-content: space-between;
        }

        .status-tag {
            font-size: 0.7em;
            text-transform: uppercase;
            color: var(--deep-forest);
            font-weight: bold;
        }
    </style>
</head>
<body style="align-items: stretch;">

    <div class="container" style="max-width: 1100px; height: 90vh; display: flex; flex-direction: column;">
        <h1>the arcane engine</h1>
        
        <div id="split-view">
            <div class="engine-panel">
                <div class="panel-header" style="color: #38bdf8;">
                    <span>Gemini Engine</span>
                    <span id="gemini-status" style="font-size: 0.7em;">Idle</span>
                </div>
                <div class="form-group">
                    <label>gemini api key</label>
                    <input type="password" id="gemini_key_input" placeholder="Enter key...">
                </div>
                <button class="btn" onclick="saveAndFetchGemini()">Bind Gemini</button>
                <div class="model-list" id="gemini-models-list">
                    <p style="font-style: italic; color: var(--earth-brown);">No models discovered...</p>
                </div>
            </div>

            <div class="engine-panel">
                <div class="panel-header" style="color: #10a37f;">
                    <span>OpenAI Engine</span>
                    <span id="openai-status" style="font-size: 0.7em;">Idle</span>
                </div>
                <div class="form-group">
                    <label>openai api key</label>
                    <input type="password" id="openai_key_input" placeholder="Enter key...">
                </div>
                <button class="btn" onclick="saveAndFetchOpenAI()">Bind OpenAI</button>
                <div class="model-list" id="openai-models-list">
                    <p style="font-style: italic; color: var(--earth-brown);">No models discovered...</p>
                </div>
            </div>
        </div>

        <div style="margin-top: 20px; text-align: center;">
            <a href="index.html" class="btn secondary">Return to Library</a>
        </div>
    </div>

    <script>
        window.onload = function() {
            const gKey = localStorage.getItem('gemini_key');
            const oKey = localStorage.getItem('openai_key');
            if(gKey) {
                document.getElementById('gemini_key_input').value = gKey;
                fetchGemini(gKey);
            }
            if(oKey) {
                document.getElementById('openai_key_input').value = oKey;
                fetchOpenAI(oKey);
            }
        }

        async function saveAndFetchGemini() {
            const key = document.getElementById('gemini_key_input').value;
            localStorage.setItem('gemini_key', key);
            fetchGemini(key);
        }

        async function saveAndFetchOpenAI() {
            const key = document.getElementById('openai_key_input').value;
            localStorage.setItem('openai_key', key);
            fetchOpenAI(key);
        }

        async function fetchGemini(key) {
            const status = document.getElementById('gemini-status');
            const list = document.getElementById('gemini-models-list');
            status.innerText = "Consulting...";
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${key}`);
                const data = await response.json();
                if(data.models) {
                    list.innerHTML = data.models
                        .filter(m => m.supportedActions.includes('generateContent'))
                        .map(m => `<div class="model-item"><span>${m.name.split('/')[1]}</span><span class="status-tag">Active</span></div>`)
                        .join('');
                    status.innerText = "Ready";
                } else { throw new Error(); }
            } catch (e) {
                list.innerHTML = "<p style='color:red'>Access Denied</p>";
                status.innerText = "Failed";
            }
        }

        async function fetchOpenAI(key) {
            const status = document.getElementById('openai-status');
            const list = document.getElementById('openai-models-list');
            status.innerText = "Consulting...";
            try {
                const response = await fetch('https://api.openai.com/v1/models', {
                    headers: { 'Authorization': `Bearer ${key}` }
                });
                const data = await response.json();
                if(data.data) {
                    list.innerHTML = data.data
                        .filter(m => m.id.includes('gpt') || m.id.includes('o1'))
                        .map(m => `<div class="model-item"><span>${m.id}</span><span class="status-tag">Active</span></div>`)
                        .join('');
                    status.innerText = "Ready";
                } else { throw new Error(); }
            } catch (e) {
                list.innerHTML = "<p style='color:red'>Access Denied</p>";
                status.innerText = "Failed";
            }
        }
    </script>
</body>
</html>
