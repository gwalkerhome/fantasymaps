<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>v1.2 | ai comparison arena</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        /* ... existing styles ... */
        #version-badge {
            font-size: 0.6em;
            background: var(--earth-brown);
            color: #fff;
            padding: 2px 8px;
            border-radius: 10px;
            vertical-align: middle;
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="back-nav">
            <a href="settings.html" class="btn secondary">← settings</a>
        </div>

        <h1 style="text-align: center;">the arena <span id="version-badge">v1.2</span></h1>

        <section class="upload-section" style="text-align: center; margin-bottom: 20px;">
            <input type="file" id="battleupload" accept=".epub">
            <button class="btn" id="startbattle">commence comparison</button>
            <button class="btn secondary" id="clearbook" style="margin-left:10px; display:none;">clear tome</button>
        </section>

        <div id="battlelog" style="text-align: center; font-family: 'Spectral'; font-style: italic; color: var(--earth-brown); margin-bottom: 10px;">
            Select a book to begin the trial...
        </div>

        <div class="arena-grid">
            <div class="ai-column gemini-border">
                <div class="stats" style="color: var(--moss-green);">Engine: Gemini 2.5-Flash</div>
                <div id="g_status">Waiting...</div>
                <textarea id="g_output" class="output-box" readonly></textarea>
            </div>

            <div class="ai-column openai-border">
                <div class="stats" style="color: #74aa9c);">Engine: GPT-4o-mini</div>
                <div id="o_status">Waiting...</div>
                <textarea id="o_output" class="output-box" readonly></textarea>
            </div>
        </div>
    </div>

    <script type="module" src="battlemaster.js"></script>
</body>
</html>
