<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>v1.2 | map test station</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .map-wrapper {
            position: relative;
            display: inline-block;
            margin: 20px auto;
            border: 3px solid var(--earth-brown);
            background: #eee;
            cursor: crosshair;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        #map-image {
            display: block;
            max-width: 100%;
            height: auto;
            user-select: none;
        }

        #map-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .grid-line { stroke: rgba(0, 0, 0, 0.15); stroke-width: 0.1; }
        .marker-point { fill: #ff4444; stroke: white; stroke-width: 0.5; cursor: pointer; pointer-events: auto; }
        .marker-polygon { fill: rgba(76, 175, 80, 0.3); stroke: #4caf50; stroke-width: 0.3; }
        .marker-path { fill: none; stroke: #2196f3; stroke-width: 0.5; stroke-dasharray: 1, 1; }
        
        .label-text { font-family: 'Cinzel', serif; font-size: 2px; fill: var(--iron-ink); paint-order: stroke; stroke: #fff; stroke-width: 0.2; }

        .coord-display {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--earth-brown);
            color: white;
            padding: 10px 15px;
            border-radius: 5px;
            font-family: monospace;
            z-index: 100;
        }

        .controls {
            margin: 20px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid var(--earth-brown);
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
    <div class="container" style="max-width: 1200px;">
        <div class="back-nav">
            <a href="aicomparison.html" class="btn secondary">← back to arena</a>
        </div>
        
        <h1 style="text-align: center;">cartographer's lightbox <span id="version-badge">v1.2</span></h1>

        <div class="controls">
            <button id="load-stored" class="btn">refresh data</button>
            <button id="toggle-grid" class="btn secondary">toggle grid</button>
            <span id="map-status">Checking for map data...</span>
        </div>

        <div class="map-wrapper" id="map-container" style="display:none;">
            <img id="map-image" src="" alt="">
            <svg id="map-svg" viewBox="0 0 100 100" preserveAspectRatio="none">
                <g id="grid-group"></g>
                <g id="polygon-group"></g>
                <g id="path-group"></g>
                <g id="point-group"></g>
            </svg>
        </div>

        <div class="coord-display">
            X: <span id="coord-x">0</span> | Y: <span id="coord-y">0</span>
        </div>
    </div>

    <script>
        const mapContainer = document.getElementById('map-container');
        const mapImage = document.getElementById('map-image');
        const gridGroup = document.getElementById('grid-group');
        const pointGroup = document.getElementById('point-group');
        const polyGroup = document.getElementById('polygon-group');
        const pathGroup = document.getElementById('path-group');
        const status = document.getElementById('map-status');

        function drawGrid() {
            gridGroup.innerHTML = '';
            for (let i = 0; i <= 100; i += 10) {
                const vLine = document.createElementNS("http://www.w3.org/2000/svg", "line");
                vLine.setAttribute("x1", i); vLine.setAttribute("y1", 0);
                vLine.setAttribute("x2", i); vLine.setAttribute("y2", 100);
                vLine.classList.add('grid-line');
                gridGroup.appendChild(vLine);

                const hLine = document.createElementNS("http://www.w3.org/2000/svg", "line");
                hLine.setAttribute("x1", 0); hLine.setAttribute("y1", i);
                hLine.setAttribute("x2", 100); hLine.setAttribute("y2", i);
                hLine.classList.add('grid-line');
                gridGroup.appendChild(hLine);
            }
        }

        function renderMapping(data) {
            pointGroup.innerHTML = '';
            polyGroup.innerHTML = '';
            pathGroup.innerHTML = '';

            data.points?.forEach(p => {
                const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                circle.setAttribute("cx", p.x);
                circle.setAttribute("cy", p.y);
                circle.setAttribute("r", 0.8);
                circle.classList.add('marker-point');
                
                const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
                text.setAttribute("x", p.x + 1);
                text.setAttribute("y", p.y - 1);
                text.textContent = p.name;
                text.classList.add('label-text');
                
                pointGroup.appendChild(circle);
                pointGroup.appendChild(text);
            });

            data.polygons?.forEach(poly => {
                const p = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
                const pointsStr = poly.coords.map(c => c.join(',')).join(' ');
                p.setAttribute("points", pointsStr);
                p.classList.add('marker-polygon');
                polyGroup.appendChild(p);
            });

            data.paths?.forEach(path => {
                const p = document.createElementNS("http://www.w3.org/2000/svg", "polyline");
                const pointsStr = path.coords.map(c => c.join(',')).join(' ');
                p.setAttribute("points", pointsStr);
                p.classList.add('marker-path');
                pathGroup.appendChild(p);
            });
        }

        function loadFromStorage() {
            const rawData = localStorage.getItem('active_map_data');
            const imgData = localStorage.getItem('active_map_image');

            if (!rawData || !imgData) {
                status.innerText = "No map data found. Run a battle first!";
                return;
            }

            try {
                const cleanJson = rawData.replace(/```json|```/g, "").trim();
                const data = JSON.parse(cleanJson);
                
                mapImage.src = imgData;
                mapContainer.style.display = 'inline-block';
                drawGrid();
                renderMapping(data);
                status.innerText = `Displaying: ${data.map_name || 'Detected Map'}`;
            } catch (e) {
                status.innerText = "Error parsing AI data.";
                console.error(e);
            }
        }

        // Auto-load when page opens
        window.onload = loadFromStorage;

        document.getElementById('load-stored').onclick = loadFromStorage;

        mapContainer.onmousemove = (e) => {
            const rect = mapContainer.getBoundingClientRect();
            const x = ((e.clientX - rect.left) / rect.width) * 100;
            const y = ((e.clientY - rect.top) / rect.height) * 100;
            document.getElementById('coord-x').innerText = Math.round(x);
            document.getElementById('coord-y').innerText = Math.round(y);
        };

        document.getElementById('toggle-grid').onclick = () => {
            gridGroup.style.display = gridGroup.style.display === 'none' ? 'block' : 'none';
        };
    </script>
</body>
</html>
